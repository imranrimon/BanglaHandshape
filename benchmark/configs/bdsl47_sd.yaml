# T3 (identity-shortcut gap) — BdSL47 ONLY, SIGNER-DEPENDENT half.
# force_random: True overrides BdSL47's user-disjoint split with a random
# 80/10/10 over ALL users, so the same signer's frames appear in train AND test
# (the shortcut). Identical encoder to bdsl47_si.yaml; gap = Top1(SD) - Top1(SI),
# predicted >= 10 pp. (Without force_random, BdSL47 is always user-disjoint.)
Experiment_name: bhc_bdsl47_sd

sources:
  bdsl47_digits:       "data/BdSL47/Bangla Sign Language Dataset - Sign Digits"
  bdsl47_letters:      "data/BdSL47/Bangla Sign Language Dataset - Sign Letters"

split:
  force_random: True
  random_val_frac: 0.10
  random_test_frac: 0.10
  seed: 0

encoder:
  timm_name: vit_small_patch14_dinov2.lvd142m
  pretrained: True
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  lora_targets: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]

image_size: 224
batch_size: 64
num_workers: 4
num_epoch: 5
base_lr: 0.0005
weight_decay: 0.01
grad_clip: 1.0
save_interval: 1
work_dir: ./work_dir/bhc_bdsl47_sd
