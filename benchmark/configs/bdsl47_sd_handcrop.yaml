# Tier-1 mechanism ablation — SD with HAND-CROP. Identical to bdsl47_sd.yaml
# (force_random) but each image is cropped to its MediaPipe hand bbox before
# resize. Pairs with bdsl47_si_handcrop.yaml: gap_handcrop = Top1(SD) - Top1(SI).
# Requires the bbox cache: data_prep/extract_hand_bbox.py (mp_kp env).
Experiment_name: bhc_bdsl47_sd_handcrop

sources:
  bdsl47_digits:       "data/BdSL47/Bangla Sign Language Dataset - Sign Digits"
  bdsl47_letters:      "data/BdSL47/Bangla Sign Language Dataset - Sign Letters"

hand_crop_cache: work_dir/_bbox_cache

split:
  force_random: True
  random_val_frac: 0.10
  random_test_frac: 0.10
  seed: 0

encoder:
  timm_name: vit_small_patch14_dinov2.lvd142m
  pretrained: True
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  lora_targets: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]

image_size: 224
batch_size: 64
num_workers: 4
num_epoch: 5
base_lr: 0.0005
weight_decay: 0.01
grad_clip: 1.0
save_interval: 1
work_dir: ./work_dir/bhc_bdsl47_sd_handcrop
