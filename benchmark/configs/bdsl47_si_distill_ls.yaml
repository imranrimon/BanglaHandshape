# E5 CONTROL (generic regularization): plain CE + label smoothing, NO KD.
# If this matches the pose-distill gain, the improvement is just regularization,
# not geometric transfer. Same encoder/split as bdsl47_si_distill.yaml.
Experiment_name: bhc_bdsl47_si_distill_ls

sources:
  bdsl47_digits:       "data/BdSL47/Bangla Sign Language Dataset - Sign Digits"
  bdsl47_letters:      "data/BdSL47/Bangla Sign Language Dataset - Sign Letters"

split:
  val_users: [4]
  test_users: [5]

encoder:
  timm_name: vit_small_patch14_dinov2.lvd142m
  pretrained: True
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  lora_targets: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]

kd:
  mode: label_smoothing   # lambda forced to 0; CE uses label_smoothing
  label_smoothing: 0.1

image_size: 224
batch_size: 64
num_workers: 4
num_epoch: 50
base_lr: 0.0005
weight_decay: 0.01
grad_clip: 1.0
save_interval: 1
work_dir: ./work_dir/bhc_bdsl47_si_distill_ls
