# Tier-1 baseline — ResNet-18 FROM SCRATCH (random init). The small-data CNN
# floor; expect it well below the foundation-model probes on the tiny sources,
# competitive only where data is plentiful (BSLD_45). Uses the shared multi-head
# training loop via the `arch: resnet18` branch in train_baseline.
Experiment_name: bhc_cnn_resnet18_scratch

sources:
  bdsl_mnist:          data/BdSL-MNIST
  bdsl47_digits:       "data/BdSL47/Bangla Sign Language Dataset - Sign Digits"
  bdsl47_letters:      "data/BdSL47/Bangla Sign Language Dataset - Sign Letters"
  bsld_45:             data/BSLD_45/Train
  bdsl49_recognition:  data/bdsl49_extracted/Recognition_1/Recognition_1/train

split:
  val_users: [4]
  test_users: [5]
  random_val_frac: 0.10
  random_test_frac: 0.10
  seed: 0

encoder:
  arch: resnet18
  pretrained: False       # from scratch
  freeze_backbone: False

image_size: 224
batch_size: 64
num_workers: 4
num_epoch: 30             # from-scratch CNNs need many more epochs than probes
base_lr: 0.001
weight_decay: 0.0001
grad_clip: 1.0
save_interval: 5
work_dir: ./work_dir/bhc_cnn_resnet18_scratch
