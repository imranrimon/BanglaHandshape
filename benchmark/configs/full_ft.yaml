# A2 (adaptation) — DINOv2-S full fine-tune (the upper-bound / overfit endpoint
# of the probe -> LoRA -> full-FT curve). Whole backbone trains end-to-end, so
# use a small LR and watch for overfitting on the tiny SI splits.
Experiment_name: bhc_full_ft

sources:
  bdsl_mnist:          data/BdSL-MNIST
  bdsl47_digits:       "data/BdSL47/Bangla Sign Language Dataset - Sign Digits"
  bdsl47_letters:      "data/BdSL47/Bangla Sign Language Dataset - Sign Letters"
  bsld_45:             data/BSLD_45/Train
  bdsl49_recognition:  data/bdsl49_extracted/Recognition_1/Recognition_1/train

split:
  val_users: [4]
  test_users: [5]
  random_val_frac: 0.10
  random_test_frac: 0.10
  seed: 0

encoder:
  timm_name: vit_small_patch14_dinov2.lvd142m
  pretrained: True
  full_finetune: True     # no LoRA; entire backbone trains

image_size: 224
batch_size: 32            # full backbone grads -> more VRAM than probe/LoRA
num_workers: 4
num_epoch: 10
base_lr: 0.00001          # small LR for full-FT of a pretrained ViT
weight_decay: 0.05
grad_clip: 1.0
save_interval: 2
work_dir: ./work_dir/bhc_full_ft
