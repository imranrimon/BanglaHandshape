# Tier-2 method (pose⊕RGB fusion) — SIGNER-INDEPENDENT half of BdSL47.
# Trains appearance / pose / fusion heads on the SAME user-disjoint split as
# bdsl47_si.yaml. Pairs with fusion_bdsl47_sd.yaml:
#   gap_modality = Top1(SD) - Top1(SI);  headline: gap_fusion < gap_appearance.
# Requires the keypoint cache (data_prep/extract_keypoints.py) first.
Experiment_name: bhc_fusion_si

sources:
  bdsl47_digits:   "data/BdSL47/Bangla Sign Language Dataset - Sign Digits"
  bdsl47_letters:  "data/BdSL47/Bangla Sign Language Dataset - Sign Letters"

split:
  val_users: [4]
  test_users: [5]
  # force_random omitted -> BdSL47 user-disjoint (SI).

encoder:
  timm_name: vit_base_patch14_dinov2.lvd142m   # frozen DINOv2-B (best A1 backbone)
  image_size: 224

head:
  hidden: 256
  depth: 2
  dropout: 0.2

batch_size: 256
num_epoch: 50
base_lr: 0.001
weight_decay: 0.01
num_workers: 4
work_dir: ./work_dir/bhc_fusion_si
