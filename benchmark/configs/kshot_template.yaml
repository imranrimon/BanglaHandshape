# A4 (data efficiency) — few-shot template. Caps the TRAIN set to
# `max_train_per_class` images per class (val untouched), to trace the
# label-efficiency curve. Sweep k by copying this and changing the cap:
#   k in {1, 5, 10, 20, 0}   (0 = use all -> equals the full LoRA run)
# Everything else mirrors the base LoRA config so only data volume varies.
Experiment_name: bhc_kshot_k10

sources:
  bdsl_mnist:          data/BdSL-MNIST
  bdsl47_digits:       "data/BdSL47/Bangla Sign Language Dataset - Sign Digits"
  bdsl47_letters:      "data/BdSL47/Bangla Sign Language Dataset - Sign Letters"
  bsld_45:             data/BSLD_45/Train
  bdsl49_recognition:  data/bdsl49_extracted/Recognition_1/Recognition_1/train

split:
  val_users: [4]
  test_users: [5]
  random_val_frac: 0.10
  random_test_frac: 0.10
  seed: 0
  max_train_per_class: 10   # <-- the k in k-shot

encoder:
  timm_name: vit_small_patch14_dinov2.lvd142m
  pretrained: True
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  lora_targets: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]

image_size: 224
batch_size: 64
num_workers: 4
num_epoch: 10             # small data -> a few more passes
base_lr: 0.0005
weight_decay: 0.01
grad_clip: 1.0
save_interval: 2
work_dir: ./work_dir/bhc_kshot_k10
