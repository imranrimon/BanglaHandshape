# A1 (paradigm) — supervised-ImageNet ViT-S, linear probe.
# Same backbone scale as the DINOv2-S probe, so the delta isolates the
# PRETRAINING PARADIGM: supervised (this) vs self-supervised (DINOv2).
Experiment_name: bhc_probe_imagenet_vit_s

sources:
  bdsl_mnist:          data/BdSL-MNIST
  bdsl47_digits:       "data/BdSL47/Bangla Sign Language Dataset - Sign Digits"
  bdsl47_letters:      "data/BdSL47/Bangla Sign Language Dataset - Sign Letters"
  bsld_45:             data/BSLD_45/Train
  bdsl49_recognition:  data/bdsl49_extracted/Recognition_1/Recognition_1/train

split:
  val_users: [4]
  test_users: [5]
  random_val_frac: 0.10
  random_test_frac: 0.10
  seed: 0

encoder:
  # verify tag: python -c "import timm; print(timm.list_models('vit_small_patch16_224*'))"
  timm_name: vit_small_patch16_224.augreg_in1k
  pretrained: True
  lora_rank: 0          # linear probe
  lora_targets: []

image_size: 224
batch_size: 64
num_workers: 4
num_epoch: 5
base_lr: 0.001
weight_decay: 0.0001
grad_clip: 1.0
save_interval: 1
work_dir: ./work_dir/bhc_probe_imagenet_vit_s
