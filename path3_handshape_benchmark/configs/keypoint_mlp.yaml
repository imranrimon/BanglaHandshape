# A6 (modality) — MediaPipe hand-keypoint MLP, signer-independent.
# Pose counterpart to bdsl47_si (appearance/DINOv2) on IDENTICAL BdSL47 images
# and the SAME user-disjoint split -> a clean appearance-vs-pose comparison
# (parallels the main paper's Option B). BSLD_45 is intentionally absent: its
# images carry a drawn hand skeleton (0% MediaPipe re-detection).
# Requires the keypoint cache first:
#   <mp_kp python> preprocessing/extract_keypoints.py --only bdsl47_digits bdsl47_letters
Experiment_name: bhc_keypoint_mlp

sources:
  bdsl47_digits:   "data/BdSL47/Bangla Sign Language Dataset - Sign Digits"
  bdsl47_letters:  "data/BdSL47/Bangla Sign Language Dataset - Sign Letters"

split:
  val_users: [4]
  test_users: [5]
  # force_random omitted -> BdSL47 user-disjoint (SI), same as bdsl47_si.

mlp:
  hidden: 256
  depth: 3
  dropout: 0.2

batch_size: 256
num_epoch: 50
base_lr: 0.001
weight_decay: 0.01
work_dir: ./work_dir/bhc_keypoint_mlp
