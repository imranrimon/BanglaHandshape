[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banglahandshape"
version = "1.0.0"
description = "A signer-independent benchmark for still-image Bangla Sign Language handshape classification"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Muhammad Imran Hossain (Rimon)" }]
keywords = [
  "sign language recognition",
  "Bangla Sign Language",
  "signer-independent evaluation",
  "handshape classification",
  "DINOv2",
  "LoRA",
  "benchmark",
]
classifiers = [
  "Programming Language :: Python :: 3.8",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are managed by the conda environment (environment.yml),
# which pins the CUDA build of PyTorch. Install the package itself with
# `pip install -e . --no-deps` inside that environment.

[project.urls]
Repository = "https://github.com/imranrimon/BanglaHandshape"

[tool.setuptools]
packages = [
  "banglahandshape",
  "benchmark",
  "benchmark.baselines",
  "benchmark.analysis",
  "benchmark.figures",
  "domain_adapt",
  "tools",
]
